<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mehmood Hassan — Python &amp;Based Full-Stack Developer</title>
  <desc id="desc">An animated professional dark black and orange profile card with smooth color transitions.</desc>

  <style>
    /* Interactivity */
    .tech-badge {
      transition: transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }
    .tech-badge:hover {
      transform: translateY(-3px);
      filter: drop-shadow(0px 3px 10px rgba(255, 102, 0, 0.7));
    }
    .name-title {
      transition: fill 0.3s ease;
      cursor: pointer;
    }
    .name-title:hover {
      fill: #FF9933;
    }
  </style>

  <defs>
    <!-- Background Gradient: Black & Deep Charcoal to Vibrant Orange Transitions -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#0D0D0D;#1A0B00;#0A0500;#000000" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#141414">
        <animate attributeName="stop-color" values="#141414;#8B3A00;#FF6600;#331400;#141414" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#FF6600">
        <animate attributeName="stop-color" values="#FF6600;#CC5200;#141414;#FF8533;#FF6600" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#FF8533" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <clipPath id="cardClip">
      <rect width="1200" height="260" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="260" fill="url(#background)"/>

    <!-- Glowing Background Orbs -->
    <circle cx="120" cy="35" r="190" fill="url(#glow)" opacity="0.5">
      <animate attributeName="cx" values="120;430;120" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="35;95;35" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="220" r="230" fill="url(#glow)" opacity="0.4">
      <animate attributeName="cx" values="1080;790;1080" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;150;220" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Waves Component -->
    <path d="M-60 202C170 122 352 258 610 188C824 130 990 134 1260 55V290H-60V202Z" fill="#0A0A0A" fill-opacity="0.45">
      <animate attributeName="d" values="M-60 202C170 122 352 258 610 188C824 130 990 134 1260 55V290H-60V202Z;M-60 174C190 246 380 121 625 192C865 262 1012 112 1260 104V290H-60V174Z;M-60 202C170 122 352 258 610 188C824 130 990 134 1260 55V290H-60V202Z" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- Shine Sweep Animation -->
    <rect x="-320" y="0" width="240" height="260" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-320;1450" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Sparkle Particles -->
    <g opacity="0.7">
      <circle cx="75" cy="58" r="3" fill="#FF8533"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1105" cy="57" r="4" fill="#FFA366"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="185" r="3" fill="#FFFFFF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="257" rx="26.5" stroke="#FF6600" stroke-opacity="0.6" stroke-width="3"/>

  <!-- Content Text -->
  <g filter="url(#shadow)" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text class="name-title" x="600" y="88" fill="#FFFFFF" font-size="54" font-weight="750" letter-spacing="1.5">Mehmood Hassan</text>
    <text x="600" y="126" fill="#FF9933" font-size="19" font-weight="600" letter-spacing="3.5">PYTHON &amp;BASED WEB DEVELOPER • A PART OF DEVWEEKENDS FELLOWSHIP</text>
    <text x="600" y="156" fill="#FFCC99" font-size="13" font-weight="500" letter-spacing="2">BUILDING FULL-STACK SYSTEMS • SEEKING PAID INTERNSHIPS</text>
  </g>

  <!-- Interactive Skill Badges -->
  <g transform="translate(305, 172)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">
    <!-- Python -->
    <g class="tech-badge" transform="translate(0, 0)">
      <rect width="80" height="26" rx="13" fill="#0A0A0A" fill-opacity="0.8" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.2"/>
      <text x="40" y="17" fill="#FFCC99" text-anchor="middle">Python</text>
    </g>
    <!-- JavaScript -->
    <g class="tech-badge" transform="translate(90, 0)">
      <rect width="100" height="26" rx="13" fill="#0A0A0A" fill-opacity="0.8" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.2"/>
      <text x="50" y="17" fill="#FFCC99" text-anchor="middle">JavaScript</text>
    </g>
    <!-- Node.js -->
    <g class="tech-badge" transform="translate(200, 0)">
      <rect width="85" height="26" rx="13" fill="#0A0A0A" fill-opacity="0.8" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.2"/>
      <text x="42.5" y="17" fill="#FFCC99" text-anchor="middle">Node.js</text>
    </g>
    <!-- React / Next.js -->
    <g class="tech-badge" transform="translate(295, 0)">
      <rect width="125" height="26" rx="13" fill="#0A0A0A" fill-opacity="0.8" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.2"/>
      <text x="62.5" y="17" fill="#FFCC99" text-anchor="middle">React / Next.js</text>
    </g>
    <!-- Django -->
    <g class="tech-badge" transform="translate(430, 0)">
      <rect width="80" height="26" rx="13" fill="#0A0A0A" fill-opacity="0.8" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.2"/>
      <text x="40" y="17" fill="#FFCC99" text-anchor="middle">DSA</text>
    </g>
    <!-- Figma -->
    <g class="tech-badge" transform="translate(520, 0)">
      <rect width="70" height="26" rx="13" fill="#0A0A0A" fill-opacity="0.8" stroke="#FF6600" stroke-opacity="0.8" stroke-width="1.2"/>
      <text x="35" y="17" fill="#FFCC99" text-anchor="middle">Figma</text>
    </g>
  </g>

  <!-- Bottom Indicator Bar -->
  <g transform="translate(535 220)">
    <rect width="130" height="4" rx="2" fill="#FF6600" fill-opacity="0.25"/>
    <rect width="42" height="4" rx="2" fill="#FF6600">
      <animate attributeName="x" values="0;88;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
